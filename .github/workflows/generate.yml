name: Generate VLESS subscriptions

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions 使用 UTC
    # 每小时第 24 分钟尝试执行一次
    - cron: '24 */2 * * *'

permissions:
  contents: read

concurrency:
  group: cf-ip-pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install \
            --disable-pip-version-check \
            -r requirements.txt

      - name: Generate subscriptions
        run: |
          python -m py_compile src/generator.py
          python -u src/generator.py

      - name: Validate output
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python <<'PY'
          import base64
          from pathlib import Path
          import sys
          import yaml

          txt = Path("output/all.txt")
          yml = Path("output/all.yaml")

          if not txt.is_file():
              print("[ERROR] output/all.txt not found.")
              sys.exit(1)

          if not yml.is_file():
              print("[ERROR] output/all.yaml not found.")
              sys.exit(1)

          try:
              decoded = base64.b64decode(
                  txt.read_text(encoding="utf-8").strip(),
                  validate=True,
              ).decode("utf-8")
          except Exception as exc:
              print(f"[ERROR] all.txt is not valid Base64: {exc}")
              sys.exit(1)

          txt_count = sum(
              1 for line in decoded.splitlines()
              if line.strip().startswith("vless://")
          )

          try:
              data = yaml.safe_load(
                  yml.read_text(encoding="utf-8")
              ) or {}
              proxies = data.get("proxies", [])
              yaml_count = (
                  len(proxies)
                  if isinstance(proxies, list)
                  else 0
              )
          except Exception as exc:
              print(f"[ERROR] all.yaml parse failed: {exc}")
              sys.exit(1)

          print(f"[CHECK] TXT nodes : {txt_count}")
          print(f"[CHECK] YAML nodes: {yaml_count}")

          if txt_count <= 0:
              print("[ERROR] all.txt contains zero VLESS nodes.")
              sys.exit(1)

          if yaml_count <= 0:
              print("[ERROR] all.yaml contains zero Mihomo nodes.")
              sys.exit(1)

          if txt_count != yaml_count:
              print("[ERROR] TXT/YAML node count mismatch.")
              sys.exit(1)

          print("[OK] output validation passed.")
          PY

      - name: Calculate statistics
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import base64
          import json
          from pathlib import Path
          import yaml

          OUT = Path("output")
          HISTORY = Path("data/ip_history.json")
          CONFIG = Path("config/config.yml")

          cfg = yaml.safe_load(
              CONFIG.read_text(encoding="utf-8")
          ) or {}

          history_cfg = cfg.get("history", {}) or {}
          history_limit = int(
              history_cfg.get("max_pool_size", 200)
          )

          def count_txt(name):
              path = OUT / f"{name}.txt"
              if not path.exists():
                  return 0
              try:
                  text = base64.b64decode(
                      path.read_text(
                          encoding="utf-8"
                      ).strip()
                  ).decode("utf-8")
              except Exception:
                  return 0
              return sum(
                  1
                  for line in text.splitlines()
                  if line.strip().startswith("vless://")
              )

          def count_yaml(name):
              path = OUT / f"{name}.yaml"
              if not path.exists():
                  return 0
              try:
                  data = yaml.safe_load(
                      path.read_text(
                          encoding="utf-8"
                      )
                  ) or {}
                  proxies = data.get("proxies", [])
                  return (
                      len(proxies)
                      if isinstance(proxies, list)
                      else 0
                  )
              except Exception:
                  return 0

          groups = [
              "hk", "jp", "sg", "kr", "tw", "us", "other",
              "cmcc", "cu", "ct",
          ]

          values = {}

          for group in groups:
              values[f"{group.upper()}_TXT"] = count_txt(group)
              values[f"{group.upper()}_YAML"] = count_yaml(group)

          values["TOTAL_TXT"] = count_txt("all")
          values["TOTAL_YAML"] = count_yaml("all")

          if HISTORY.exists():
              try:
                  history = json.loads(
                      HISTORY.read_text(
                          encoding="utf-8"
                      )
                  )
                  history_count = (
                      len(history)
                      if isinstance(history, dict)
                      else 0
                  )
              except Exception:
                  history_count = 0
          else:
              history_count = 0

          values["HISTORY_COUNT"] = history_count
          values["HISTORY_LIMIT"] = history_limit

          with open(
              "/tmp/cf-ip-stats.env",
              "w",
              encoding="utf-8",
          ) as f:
              for key, value in values.items():
                  f.write(f"{key}={value}\n")

          print(
              json.dumps(
                  values,
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY

      - name: Generate Summary
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/cf-ip-stats.env

          {
            echo "# 🚀 CF-IP 生成结果"
            echo ""
            echo "## 📊 地区节点统计"
            echo ""
            echo "| 地区 | VLESS TXT | Mihomo YAML |"
            echo "|:---|---:|---:|"
            echo "| 🇭🇰 香港 HK | ${HK_TXT} | ${HK_YAML} |"
            echo "| 🇯🇵 日本 JP | ${JP_TXT} | ${JP_YAML} |"
            echo "| 🇸🇬 新加坡 SG | ${SG_TXT} | ${SG_YAML} |"
            echo "| 🇰🇷 韩国 KR | ${KR_TXT} | ${KR_YAML} |"
            echo "| 🇹🇼 台湾 TW | ${TW_TXT} | ${TW_YAML} |"
            echo "| 🇺🇸 美国 US | ${US_TXT} | ${US_YAML} |"
            echo "| 🌐 其他 OTHER | ${OTHER_TXT} | ${OTHER_YAML} |"
            echo ""
            echo "## 📡 运营商节点统计"
            echo ""
            echo "| 运营商 | VLESS TXT | Mihomo YAML |"
            echo "|:---|---:|---:|"
            echo "| 📱 中国移动 CMCC | ${CMCC_TXT} | ${CMCC_YAML} |"
            echo "| 🔗 中国联通 CU | ${CU_TXT} | ${CU_YAML} |"
            echo "| ☎️ 中国电信 CT | ${CT_TXT} | ${CT_YAML} |"
            echo ""
            echo "## 🗃️ 历史 IP 池"
            echo ""
            echo "**${HISTORY_COUNT} / ${HISTORY_LIMIT} 个 IP**"
            echo ""
            echo "- 当前源 IP 与历史 IP 一起健康检查"
            echo "- 源站消失但仍健康的 IP 继续保留"
            echo "- 连续 3 次健康检查失败后淘汰"
            echo "- DE / CN 节点不进入历史池"
            echo ""
            echo "## 📦 总计"
            echo ""
            echo "**${TOTAL_TXT} 个 VLESS 节点**"
            echo ""
            echo "**${TOTAL_YAML} 个 Mihomo 节点**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update README statistics
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/cf-ip-stats.env

          export \
            HK_TXT HK_YAML \
            JP_TXT JP_YAML \
            SG_TXT SG_YAML \
            KR_TXT KR_YAML \
            TW_TXT TW_YAML \
            US_TXT US_YAML \
            OTHER_TXT OTHER_YAML \
            CMCC_TXT CMCC_YAML \
            CU_TXT CU_YAML \
            CT_TXT CT_YAML \
            TOTAL_TXT TOTAL_YAML \
            HISTORY_COUNT HISTORY_LIMIT

          python <<'PY'
          import os
          from pathlib import Path

          readme = Path("README.md")

          if readme.exists():
              text = readme.read_text(
                  encoding="utf-8"
              )
          else:
              text = "# CF-IP 优化版\n"

          start = "<!-- CF-IP-STATS:START -->"
          end = "<!-- CF-IP-STATS:END -->"

          def e(name):
              return os.environ.get(name, "0")

          block = f"""
          {start}

          ## 📊 当前节点统计

          > 本区域由 GitHub Actions 自动更新。
          > 仅当统计数据发生变化时，README 的统计内容才会变化。

          ### 🌍 地区节点

          | 地区 | VLESS TXT | Mihomo YAML |
          |:---|---:|---:|
          | 🇭🇰 香港 HK | {e("HK_TXT")} | {e("HK_YAML")} |
          | 🇯🇵 日本 JP | {e("JP_TXT")} | {e("JP_YAML")} |
          | 🇸🇬 新加坡 SG | {e("SG_TXT")} | {e("SG_YAML")} |
          | 🇰🇷 韩国 KR | {e("KR_TXT")} | {e("KR_YAML")} |
          | 🇹🇼 台湾 TW | {e("TW_TXT")} | {e("TW_YAML")} |
          | 🇺🇸 美国 US | {e("US_TXT")} | {e("US_YAML")} |
          | 🌐 其他 OTHER | {e("OTHER_TXT")} | {e("OTHER_YAML")} |

          ### 📡 运营商节点

          | 运营商 | VLESS TXT | Mihomo YAML |
          |:---|---:|---:|
          | 📱 中国移动 CMCC | {e("CMCC_TXT")} | {e("CMCC_YAML")} |
          | 🔗 中国联通 CU | {e("CU_TXT")} | {e("CU_YAML")} |
          | ☎️ 中国电信 CT | {e("CT_TXT")} | {e("CT_YAML")} |

          ### 📦 总计

          - **VLESS：{e("TOTAL_TXT")} 个节点**
          - **Mihomo：{e("TOTAL_YAML")} 个节点**
          - **历史 IP 池：{e("HISTORY_COUNT")} / {e("HISTORY_LIMIT")}**
          - **DE / CN：排除，不占用节点池名额**

          {end}
          """.strip()

          if start in text and end in text:
              before = text.split(start, 1)[0].rstrip()
              after = text.split(end, 1)[1].lstrip()
              new_text = before + "\n\n" + block
              if after:
                  new_text += "\n\n" + after
              else:
                  new_text += "\n"
          else:
              new_text = (
                  text.rstrip()
                  + "\n\n"
                  + block
                  + "\n"
              )

          readme.write_text(
              new_text,
              encoding="utf-8"
          )

          print("[OK] README statistics updated.")
          PY

      - name: Save IP history and README
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ip_history.json README.md

          if git diff --cached --quiet; then
            echo "[INFO] IP history and README unchanged."
          else
            git commit -m "chore: update IP history and statistics"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          BASE_URL="${PAGE_URL%/}"

          {
            echo ""
            echo "# ✅ CF-IP 部署成功"
            echo ""
            echo "🌐 Pages："
            echo "${BASE_URL}/"
            echo ""
            echo "📄 VLESS："
            echo "${BASE_URL}/all.txt"
            echo ""
            echo "📄 Mihomo："
            echo "${BASE_URL}/all.yaml"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Pages: ${BASE_URL}/"
          echo "VLESS: ${BASE_URL}/all.txt"
          echo "Mihomo: ${BASE_URL}/all.yaml"
