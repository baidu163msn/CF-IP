name: Generate VLESS subscriptions

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions 使用 UTC
    - cron: "7,37 * * * *"

  push:
    paths:
      - "config/**"
      - "templates/**"
      - "src/**"
      - ".github/workflows/**"
      - "requirements.txt"


# ============================================================
# GitHub Pages 权限
# ============================================================

permissions:
  contents: read
  pages: write
  id-token: write


# ============================================================
# 防止多个 Pages 部署同时进行
# ============================================================

concurrency:
  group: pages
  cancel-in-progress: true


jobs:

  # ==========================================================
  # 生成订阅
  # ==========================================================

  generate:

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ------------------------------------------------------
      # 安装依赖
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install \
            --disable-pip-version-check \
            -r requirements.txt


      # ------------------------------------------------------
      # 生成 TXT + YAML
      # ------------------------------------------------------

      - name: Generate subscriptions
        run: |
          python src/generator.py


      # ======================================================
      # OUTPUT
      # ======================================================

      - name: OUTPUT
        shell: bash
        run: |

          echo ""
          echo "========================================"
          echo "        CF-IP OUTPUT"
          echo "========================================"
          echo ""

          echo "生成时间：$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""


          # --------------------------------------------------
          # 统计 Base64 VLESS TXT 节点
          # --------------------------------------------------

          count_txt_nodes() {

            local file="$1"

            if [ -f "$file" ]; then

              base64 -d "$file" 2>/dev/null \
                | awk '
                    /^vless:\/\// {
                      n++
                    }
                    END {
                      print n+0
                    }
                  '

            else

              echo "0"

            fi
          }


          # --------------------------------------------------
          # 统计 YAML proxies
          # --------------------------------------------------

          count_yaml_nodes() {

            local file="$1"

            if [ -f "$file" ]; then

              awk '
                /^[[:space:]]*-[[:space:]]name:/ {
                  n++
                }
                END {
                  print n+0
                }
              ' "$file"

            else

              echo "0"

            fi
          }


          TOTAL=$(count_txt_nodes "output/all.txt")


          echo "节点总数：$TOTAL"
          echo ""

          echo "----------------------------------------"
          printf "%-18s %8s %8s\n" \
            "文件" \
            "TXT" \
            "YAML"

          echo "----------------------------------------"


          # --------------------------------------------------
          # 地区统计
          # --------------------------------------------------

          for region in \
            hk \
            jp \
            sg \
            kr \
            tw \
            us \
            de \
            cn \
            other
          do

            txt="output/${region}.txt"
            yaml="output/${region}.yaml"

            if [ -f "$txt" ] || [ -f "$yaml" ]; then

              txt_count=$(
                count_txt_nodes "$txt"
              )

              yaml_count=$(
                count_yaml_nodes "$yaml"
              )

              printf "%-18s %8s %8s\n" \
                "${region}.txt" \
                "$txt_count" \
                "$yaml_count"

            fi

          done


          # --------------------------------------------------
          # ALL
          # --------------------------------------------------

          echo "----------------------------------------"

          all_txt_count=$(
            count_txt_nodes \
              "output/all.txt"
          )

          all_yaml_count=$(
            count_yaml_nodes \
              "output/all.yaml"
          )

          printf "%-18s %8s %8s\n" \
            "ALL" \
            "$all_txt_count" \
            "$all_yaml_count"

          echo "----------------------------------------"
          echo ""

          echo "Pages:"
          echo "https://baidu163msn.github.io/CF-IP/"
          echo ""

          echo "VLESS TXT:"
          echo "https://baidu163msn.github.io/CF-IP/all.txt"
          echo ""

          echo "Mihomo YAML:"
          echo "https://baidu163msn.github.io/CF-IP/all.yaml"

          echo ""

          echo "========================================"


      # ======================================================
      # GitHub Actions Summary
      # ======================================================

      - name: Generate Summary
        shell: bash
        run: |

          count_txt_nodes() {

            local file="$1"

            if [ -f "$file" ]; then

              base64 -d "$file" 2>/dev/null \
                | awk '
                    /^vless:\/\// {
                      n++
                    }
                    END {
                      print n+0
                    }
                  '

            else

              echo "0"

            fi
          }


          count_yaml_nodes() {

            local file="$1"

            if [ -f "$file" ]; then

              awk '
                /^[[:space:]]*-[[:space:]]name:/ {
                  n++
                }
                END {
                  print n+0
                }
              ' "$file"

            else

              echo "0"

            fi
          }


          TOTAL=$(count_txt_nodes "output/all.txt")


          {
            echo "# 🚀 CF-IP 生成结果"
            echo ""

            echo "**生成时间：**"
            echo ""
            echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""

            echo "## 📊 节点统计"
            echo ""

            echo "| 地区 | VLESS TXT | Mihomo YAML |"
            echo "|:---|---:|---:|"


            for region in \
              hk \
              jp \
              sg \
              kr \
              tw \
              us \
              de \
              cn \
              other
            do

              txt="output/${region}.txt"
              yaml="output/${region}.yaml"

              if [ -f "$txt" ] || [ -f "$yaml" ]; then

                txt_count=$(
                  count_txt_nodes "$txt"
                )

                yaml_count=$(
                  count_yaml_nodes "$yaml"
                )

                echo "| ${region} | ${txt_count} | ${yaml_count} |"

              fi

            done


            echo ""
            echo "## 📦 总计"
            echo ""

            echo "**${TOTAL} 个 VLESS 节点**"
            echo ""

            echo "## 🌐 GitHub Pages"
            echo ""

            echo "[打开订阅首页](https://baidu163msn.github.io/CF-IP/)"
            echo ""

            echo "[打开 VLESS all.txt](https://baidu163msn.github.io/CF-IP/all.txt)"
            echo ""

            echo "[打开 Mihomo all.yaml](https://baidu163msn.github.io/CF-IP/all.yaml)"

          } >> "$GITHUB_STEP_SUMMARY"


      # ======================================================
      # 上传 GitHub Pages
      # ======================================================

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output


  # ==========================================================
  # Deploy
  # ==========================================================

  deploy:

    needs: generate

    runs-on: ubuntu-latest

    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}


    steps:

      - name: Deploy to GitHub Pages

        id: deployment

        uses: actions/deploy-pages@v4


      # ======================================================
      # 部署结果
      # ======================================================

      - name: Deployment OUTPUT

        shell: bash

        run: |

          echo ""
          echo "========================================"
          echo "       CF-IP DEPLOYMENT"
          echo "========================================"
          echo ""

          echo "状态：✅ GitHub Pages 部署成功"
          echo ""

          echo "Pages："
          echo "${{ steps.deployment.outputs.page_url }}"
          echo ""

          echo "VLESS TXT："
          echo "https://baidu163msn.github.io/CF-IP/all.txt"
          echo ""

          echo "Mihomo YAML："
          echo "https://baidu163msn.github.io/CF-IP/all.yaml"
          echo ""

          echo "========================================"


          {
            echo ""
            echo "# ✅ CF-IP 部署成功"
            echo ""

            echo "GitHub Pages 已成功部署。"
            echo ""

            echo "🌐 **Pages：**"
            echo ""

            echo "[打开 Pages](${{ steps.deployment.outputs.page_url }})"
            echo ""

            echo "📄 **VLESS：**"
            echo ""

            echo "[all.txt](https://baidu163msn.github.io/CF-IP/all.txt)"
            echo ""

            echo "📄 **Mihomo：**"
            echo ""

            echo "[all.yaml](https://baidu163msn.github.io/CF-IP/all.yaml)"

          } >> "$GITHUB_STEP_SUMMARY"
