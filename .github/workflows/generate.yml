name: Generate VLESS subscriptions

on:
workflow_dispatch:

schedule:
# GitHub Actions 使用 UTC
# 每小时第 7 分钟执行
- cron: "7 * * * *"

push:
paths:
- "config/"
- "templates/"
- "src/"
- ".github/workflows/"
- "requirements.txt"

permissions:
contents: write
pages: write
id-token: write

concurrency:
group: cf-ip-pages
cancel-in-progress: true

jobs:

generate:
runs-on: ubuntu-latest

steps:

  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      python -m pip install --disable-pip-version-check -r requirements.txt

  - name: Generate subscriptions
    run: |
      python src/generator.py

  - name: Verify output
    shell: bash
    run: |
      set -e

      echo "========================================"
      echo "CF-IP OUTPUT CHECK"
      echo "========================================"

      echo ""
      echo "工作目录："
      pwd

      echo ""
      echo "output 目录："
      ls -lah output || true

      echo ""
      echo "data 目录："
      ls -lah data || true

      echo ""
      echo "========================================"

      if [ ! -d "output" ]; then
        echo "ERROR: output directory does not exist."
        exit 1
      fi

      if [ ! -f "output/all.txt" ]; then
        echo "ERROR: output/all.txt does not exist."
        exit 1
      fi

      if [ ! -f "output/all.yaml" ]; then
        echo "ERROR: output/all.yaml does not exist."
        exit 1
      fi

      echo "output/all.txt: OK"
      echo "output/all.yaml: OK"

      echo ""
      echo "========================================"

  - name: Generate statistics
    shell: bash
    run: |
      echo "# 🚀 CF-IP 生成结果" >> "$GITHUB_STEP_SUMMARY"
      echo "" >> "$GITHUB_STEP_SUMMARY"

      echo "**生成时间：** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_STEP_SUMMARY"
      echo "" >> "$GITHUB_STEP_SUMMARY"

      count_txt_nodes() {
        local file="$1"

        if [ -f "$file" ]; then
          base64 -d "$file" 2>/dev/null |
            grep -c '^vless://' || true
        else
          echo "0"
        fi
      }

      count_yaml_nodes() {
        local file="$1"

        if [ -f "$file" ]; then
          grep -c '^[[:space:]]*-[[:space:]]*name:' "$file" || true
        else
          echo "0"
        fi
      }

      TOTAL_TXT=$(count_txt_nodes "output/all.txt")
      TOTAL_YAML=$(count_yaml_nodes "output/all.yaml")

      if [ -f "data/ip_history.json" ]; then
        HISTORY_COUNT=$(python - <<'PY'
      import json

      try:
          with open("data/ip_history.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          if isinstance(data, dict):
              print(len(data))
          elif isinstance(data, list):
              print(len(data))
          else:
              print(0)
      except Exception:
          print(0)
      PY
        )
      else
        HISTORY_COUNT=0
      fi

      echo "## 📊 节点统计" >> "$GITHUB_STEP_SUMMARY"
      echo "" >> "$GITHUB_STEP_SUMMARY"
      echo "| 项目 | 数量 |" >> "$GITHUB_STEP_SUMMARY"
      echo "|:---|---:|" >> "$GITHUB_STEP_SUMMARY"
      echo "| VLESS TXT | ${TOTAL_TXT} |" >> "$GITHUB_STEP_SUMMARY"
      echo "| Mihomo YAML | ${TOTAL_YAML} |" >> "$GITHUB_STEP_SUMMARY"
      echo "| 历史 IP | ${HISTORY_COUNT} |" >> "$GITHUB_STEP_SUMMARY"
      echo "" >> "$GITHUB_STEP_SUMMARY"

      echo "## 🌐 GitHub Pages" >> "$GITHUB_STEP_SUMMARY"
      echo "" >> "$GITHUB_STEP_SUMMARY"
      echo "[CF-IP 首页](https://baidu163msn.github.io/CF-IP/)" >> "$GITHUB_STEP_SUMMARY"
      echo "" >> "$GITHUB_STEP_SUMMARY"
      echo "[VLESS all.txt](https://baidu163msn.github.io/CF-IP/all.txt)" >> "$GITHUB_STEP_SUMMARY"
      echo "" >> "$GITHUB_STEP_SUMMARY"
      echo "[Mihomo all.yaml](https://baidu163msn.github.io/CF-IP/all.yaml)" >> "$GITHUB_STEP_SUMMARY"

      echo ""
      echo "========================================"
      echo "VLESS TXT nodes : ${TOTAL_TXT}"
      echo "Mihomo YAML nodes: ${TOTAL_YAML}"
      echo "History IP count : ${HISTORY_COUNT}"
      echo "========================================"

  - name: Save IP history
    shell: bash
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      if [ ! -f "data/ip_history.json" ]; then
        echo "[INFO] No IP history file generated."
        exit 0
      fi

      if git diff --quiet -- data/ip_history.json; then
        echo "[INFO] IP history unchanged."
      else
        git add data/ip_history.json
        git commit -m "chore: update IP history"
        git push
      fi

  - name: Upload Pages artifact
    uses: actions/upload-pages-artifact@v3
    with:
      path: output
runs-on: ubuntu-latest

environment:
  name: github-pages
  url: ${{ steps.deployment.outputs.page_url }}

steps:

  - name: Deploy to GitHub Pages
    id: deployment
    uses: actions/deploy-pages@v4

  - name: Deployment summary
    shell: bash
    run: |
      echo "# ✅ CF-IP 部署成功" >> "$GITHUB_STEP_SUMMARY"
      echo "" >> "$GITHUB_STEP_SUMMARY"
      echo "GitHub Pages：${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
      echo "" >> "$GITHUB_STEP_SUMMARY"
      echo "VLESS：https://baidu163msn.github.io/CF-IP/all.txt" >> "$GITHUB_STEP_SUMMARY"
      echo "" >> "$GITHUB_STEP_SUMMARY"
      echo "Mihomo：https://baidu163msn.github.io/CF-IP/all.yaml" >> "$GITHUB_STEP_SUMMARY"
