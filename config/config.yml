# cf-vless-generator
# 所有可变参数集中在这里，GitHub Actions / Python 无需修改。
sources:
  - name: YD-V4
    url: https://raw.githubusercontent.com/svip-s/cloudflare_ip/refs/heads/main/best_ips.txt
    kind: ip

template:
  uuid: "ade2ed4a-9040-4e1a-a086-3a44cb5d017b"
  path: "/vl/K3Gy4eepcyrBuXpkgO8FJ3VyCnfCNTi?ed=2560"
  security: "tls"
  alpn: "http/1.1"
  encryption: "none"
  insecure: 0
  host: "b.95500.us.ci"
  fp: "chrome"
  # type: ws | grpc（其它值会退化为不带专属参数的通用 VLESS 链接）
  type: "ws"
  # 仅在 type: grpc 时生效，对应 VLESS 链接里的 serviceName
  # 以及 Mihomo 的 grpc-opts.grpc-service-name
  serviceName: ""
  allowInsecure: 0
  sni: "b.95500.us.ci"

test:
  enabled: true
  connect_timeout: 3.0
  tls_timeout: 4.0
  concurrency: 40
  # true：健康检查时按标准 TLS 流程校验证书（对 SNI 域名做正常验证）
  # false（默认）：只要求 TLS 握手成功，不校验证书——
  #   适合"借用 Cloudflare 边缘 IP 做 SNI 前置"的场景，
  #   因为边缘 IP 本身不会持有 sni 对应域名的证书。
  tls_verify: false
  # GitHub 托管 Runner（ubuntu-latest）默认没有公网 IPv6 出网能力，
  # 会导致所有 IPv6 候选在健康检查阶段必然失败、永远进不了订阅。
  # 打开这项后，IPv6 候选跳过真实连接测试，直接信任源站数据。
  # 注意：这意味着 IPv6 节点完全没有被验证过是否存活。
  skip_ipv6_test: true
  # 节点真实性检测方式：
  #   tls   只做 TCP + TLS 握手（原有行为，只能证明 IP 开着 443）
  #   ws    再按模板里的 host / path 发一个真实的 WebSocket 升级请求，
  #         要求返回 101（证明这个 IP 能把请求转发到你的服务端）
  #   vless 在 ws 基础上真的走一次 VLESS，经隧道访问 probe_host，
  #         拿到 HTTP 响应才算通过（最接近真实使用，最严格）
  # 模板 type 不是 ws（例如 grpc）时自动退回 tls。
  mode: "ws"
  # 仅 mode: vless 使用：经隧道访问的探测地址（HTTP，80 端口）
  probe_host: "cp.cloudflare.com"
  probe_port: 80
  probe_path: "/generate_204"
  # ws / vless 每个候选的读写超时（秒）
  probe_timeout: 6.0

output:
  # true：首页会额外显示"观察中、未连续失败 3 次"的历史 IP 数量
  #   （仅展示统计数字，这些 IP 不会进入任何订阅文件）
  keep_failed: false
  # false：即使某个源的 kind 是 domain，也全局跳过域名类候选，
  #   只保留 IP 类型的节点
  include_domain_source: true
  # 每个分类各自的数量上限：每个地区文件（hk / jp ...）
  # 和每个运营商文件（cmcc / ct / cu）各自最多这么多个，
  # 互不共享额度。候选不够时全部保留，超过时取延迟最低的。
  max_nodes_per_region: 20
  # all.txt / all.yaml 的总数硬上限，0 = 不限制
  # （不限制时 all 就是各分类结果的并集，同一个 IP 只出现一次）
  max_nodes_total: 0
  naming: "{REGION}-{INDEX:02d}"
  # 首页展示用的中文地区名；不影响节点命名/订阅内容
  regions:
    HK: "香港"
    JP: "日本"
    SG: "新加坡"
    KR: "韩国"
    TW: "台湾"
    US: "美国"
    DE: "德国"
    CN: "中国"
    CU: "联通"
    CT: "电信"
    CMCC: "移动"
    OTHER: "其他"
