# cf-vless-generator
# 地区别名 + 历史节点池 + DE/CN 排除优化版

sources:
  - name: vvHan-V6
    url: https://bestcf.pages.dev/vvhan/ipv6.txt
    kind: ip

template:
  uuid: "2a2038c5-a62c-4f59-af4f-733426d37193"
  path: "/vl/jQsuRDqw1EIbHAHo2xsZGsHFg?ed=2560"
  security: "tls"
  alpn: "http/1.1"
  encryption: "none"
  insecure: 0
  host: "b.0246.us.ci"
  fp: "chrome"
  type: "ws"
  serviceName: ""
  allowInsecure: 0
  sni: "b.0246.us.ci"

test:
  enabled: true
  connect_timeout: 3.0
  tls_timeout: 4.0
  concurrency: 40
  tls_verify: false
  skip_ipv6_test: true
  real_check: true
  real_check_timeout: 5.0

history:
  max_pool_size: 200
  max_failures: 3

  # 历史池满时优先保证这些地区各有最低备用库存。
  min_nodes_per_region:
    HK: 2
    JP: 2
    SG: 2
    KR: 2
    TW: 2
    US: 2

output:
  keep_failed: false
  include_domain_source: true

  # 每个地区/运营商订阅最多输出多少节点。
  max_nodes_per_region: 10

  # 0 = 不限制 all.txt / all.yaml 总节点数。
  max_nodes_total: 0

  naming: "{REGION}-{INDEX:02d}"

  regions:
    HK: "香港"
    JP: "日本"
    SG: "新加坡"
    KR: "韩国"
    TW: "台湾"
    US: "美国"
    OTHER: "其他"

  isp_names:
    CMCC: "中国移动"
    CU: "中国联通"
    CT: "中国电信"

# 明确的数据中心/地区代码映射。
# DE/CN 虽保留在 generator.py 的硬排除逻辑中，
# 但不放入输出地区列表，因此不会占用节点名额。
region_aliases:
  HK:
    - HK
    - HKG
    - Hong Kong
    - 香港

  JP:
    - JP
    - JPN
    - NRT
    - HND
    - TYO
    - KIX
    - OSA
    - Japan
    - 日本

