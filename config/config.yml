# cf-vless-generator
# 地区别名 + 地区历史备用池优化版

sources:
  - name: LT-V4
    url: https://raw.githubusercontent.com/love-ztm/cfip/refs/heads/main/ubest_ips.txt
    kind: ip
  - name: SW-V6
    url: https://bestcf.pages.dev/vvhan/ipv6.txt
    kind: ip

template:
  uuid: "2a2038c5-a62c-4f59-af4f-733426d37193"
  path: "/vl/jQsuRDqw1EIbHAHo2xsZGsHFg?ed=2560"
  security: "tls"
  alpn: "http/1.1"
  encryption: "none"
  insecure: 0
  host: "b.0246.us.ci"
  fp: "chrome"
  type: "ws"
  serviceName: ""
  allowInsecure: 0
  sni: "b.0246.us.ci"

test:
  enabled: true
  connect_timeout: 3.0
  tls_timeout: 4.0
  concurrency: 40
  tls_verify: false
  skip_ipv6_test: true
  real_check: true
  real_check_timeout: 5.0

history:
  max_pool_size: 60
  max_failures: 3

  # 地区最低备用库存。历史池满时先保这些地区，再用剩余名额补齐。
  min_nodes_per_region:
    HK: 2
    JP: 2
    SG: 2
    KR: 2
    TW: 2
    US: 2
    DE: 2

output:
  keep_failed: false
  include_domain_source: true
  max_nodes_per_region: 10
  max_nodes_total: 0
  naming: "{REGION}-{INDEX:02d}"

  regions:
    HK: "香港"
    JP: "日本"
    SG: "新加坡"
    KR: "韩国"
    TW: "台湾"
    US: "美国"
    DE: "德国"
    CN: "中国"
    OTHER: "其他"

  isp_names:
    CMCC: "中国移动"
    CU: "中国联通"
    CT: "中国电信"

# 明确的数据中心/机场代码映射。
# 不做模糊 GeoIP 推断；以后遇到新代码可以继续增加。
