# cf-vless-generator
# 地区别名 + 200 个历史节点池 + DE/CN 排除优化版

sources:
  - name: vvHan-V6
    url: https://bestcf.pages.dev/vvhan/ipv6.txt
    kind: ip

template:
  uuid: "2a2038c5-a62c-4f59-af4f-733426d37193"
  path: "/vl/jQsuRDqw1EIbHAHo2xsZGsHFg?ed=2560"
  security: "tls"
  alpn: "http/1.1"
  encryption: "none"
  insecure: 0
  host: "b.0246.us.ci"
  fp: "chrome"
  type: "ws"
  serviceName: ""
  allowInsecure: 0
  sni: "b.0246.us.ci"

test:
  enabled: true
  connect_timeout: 3.0
  tls_timeout: 4.0
  concurrency: 40
  tls_verify: false
  skip_ipv6_test: true
  real_check: true
  real_check_timeout: 5.0

history:
  max_pool_size: 200
  max_failures: 3
  min_nodes_per_region:
    HK: 2
    JP: 2
    SG: 2
    KR: 2
    TW: 2
    US: 2

output:
  keep_failed: false
  include_domain_source: true

  # ==========================================================
  # ⭐ 常用控制区：地区
  # ==========================================================
  # 只生成这里列出的地区订阅。
  # 删除某地区即可关闭；重新加入即可恢复。
  enabled_regions:
    - HK
    - JP
    - SG
    - KR

  # 默认每个地区最多推送多少节点。
  max_nodes_per_region: 10

  # 单独设置某地区数量时，以这里为准。
  # 未列出的地区使用 max_nodes_per_region。
  region_limits:
    HK: 10
    JP: 10
    SG: 10
    KR: 10
    TW: 10
    US: 10

  # ==========================================================
  # ⭐ 常用控制区：运营商
  # ==========================================================
  # 只生成这里列出的运营商订阅。
  enabled_isps:
    - CMCC
    - CU
    - CT

  # 每个运营商订阅最多推送多少节点。
  max_nodes_per_isp: 10

  # all.txt / all.yaml 总节点数。0 = 不限制。
  max_nodes_total: 0

  naming: "{REGION}-{INDEX:02d}"

  regions:
    HK: "香港"
    JP: "日本"
    SG: "新加坡"
    KR: "韩国"
    TW: "台湾"
    US: "美国"
    OTHER: "其他"

  isp_names:
    CMCC: "中国移动"
    CU: "中国联通"
    CT: "中国电信"

# ============================================================
# ⭐ 全局硬排除
# ============================================================
# 这些地区不会进入当前候选池、历史池或最终订阅，
# 因而不会占用 200 个历史节点池名额。
filters:
  excluded_regions:
    - DE
    - CN

region_aliases:
  HK:
    - HK
    - HKG
    - Hong Kong
    - 香港
  JP:
    - JP
    - JPN
    - NRT
    - HND
    - TYO
    - KIX
    - OSA
    - Japan
    - 日本
  SG:
    - SG
    - SGP
    - SIN
    - Singapore
    - 新加坡
  KR:
    - KR
    - KOR
    - ICN
    - SEL
    - GMP
    - Korea
    - 韩国
  TW:
    - TW
    - TWN
    - TPE
    - Taiwan
    - 台湾
  US:
    - US
    - USA
    - LAX
    - SFO
    - SEA
    - ORD
    - DFW
    - ATL
    - IAD
    - EWR
    - JFK
    - MIA
    - DEN
    - PHX
    - LAS
    - PDX
    - United States
    - 美国
  DE:
