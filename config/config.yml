# cf-vless-generator
# 地区别名 + 地区历史备用池 + DE/CN 排除 + ISP 分类

sources:
  - name: vvHan-V6
    url: https://bestcf.pages.dev/vvhan/ipv6.txt
    kind: ip

# 永久排除地区
# 这些地区：
# 1. 不进入当前候选池
# 2. 不进入健康检查
# 3. 不进入历史池
# 4. 不生成地区订阅
# 5. 不占用历史池 200 个名额
excluded_regions:
  - DE
  - CN

template:
  uuid: "2a2038c5-a62c-4f59-af4f-733426d37193"
  path: "/vl/jQsuRDqw1EIbHAHo2xsZGsHFg?ed=2560"
  security: "tls"
  alpn: "http/1.1"
  encryption: "none"
  insecure: 0
  host: "b.0246.us.ci"
  fp: "chrome"
  type: "ws"
  serviceName: ""
  allowInsecure: 0
  sni: "b.0246.us.ci"

test:
  enabled: true
  connect_timeout: 3.0
  tls_timeout: 4.0
  concurrency: 40
  tls_verify: false

  # 当前数据源是 IPv6。
  # GitHub Hosted Runner 的 IPv6 出站能力并不可靠，
  # 因此这里暂时保持 true，避免把所有 IPv6 节点误判为失败。
  skip_ipv6_test: true

  real_check: true
  real_check_timeout: 5.0

history:
  # 历史节点池
  max_pool_size: 200

  # 连续失败 3 次才淘汰
  max_failures: 3

  # 历史池满时优先保证这些地区最低库存
  min_nodes_per_region:
    HK: 2
    JP: 2
    SG: 2
    KR: 2
    TW: 2
    US: 2

output:
  keep_failed: false

  include_domain_source: true

  # 每个地区最多输出 10 个
  max_nodes_per_region: 10

  # 0 = 不限制总数
  max_nodes_total: 0

  naming: "{REGION}-{INDEX:02d}"

  regions:
    HK: "香港"
    JP: "日本"
    SG: "新加坡"
    KR: "韩国"
    TW: "台湾"
    US: "美国"
    OTHER: "其他"

  isp_names:
    CMCC: "中国移动"
    CU: "中国联通"
    CT: "中国电信"

region_aliases:
  HK:
    - HK
    - HKG
    - Hong Kong
    - 香港

  JP:
